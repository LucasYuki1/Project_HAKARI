# Gerado por infra/scripts/02_app.sh a partir de infra/config/nginx-hakari.conf.
# O Nginx é a única porta de entrada (80) e repassa tudo para a API na rede interna dos containers.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/hakari_acesso.log;
    error_log  /var/log/nginx/hakari_erro.log warn;

    location / {
        proxy_pass http://@API@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
