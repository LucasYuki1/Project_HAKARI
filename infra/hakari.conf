# Configuração do servidor Hakari, lida por todos os scripts de infra/scripts.
# O que muda de uma máquina para outra fica aqui, não espalhado dentro dos scripts.

# ---------- Identidade e rede ----------
NOME_HOST="hakari-srv"
DOMINIO="hakari.internal"
FUSO_HORARIO="America/Sao_Paulo"
DNS_SERVIDORES="1.1.1.1 8.8.8.8"     # resolvedores usados junto com o DNS da Azure
DNS_RESERVA="9.9.9.9"                # usado se os de cima não responderem
PORTAS_LIBERADAS="22/tcp 80/tcp"     # SSH e HTTP; toda outra entrada é bloqueada pelo ufw
SWAP_MB=2048

# Rede interna dos containers, com IPs fixos (no /etc/hosts como api.<domínio> e db.<domínio>)
REDE_SUBNET="172.28.0.0/24"
REDE_GATEWAY="172.28.0.1"
IP_API="172.28.0.10"
IP_DB="172.28.0.20"
PORTA_API=8080

# ---------- Aplicação ----------
DIR_SEGREDOS="/etc/hakari"
ARQUIVO_AMBIENTE="/etc/hakari/hakari.env"   # senhas e chaves geradas na instalação (permissão 600)

# ---------- Monitoramento ----------
INTERVALO_SEGUNDOS=15        # de quanto em quanto tempo o monitor confere tudo
LIMITE_CPU=85                # % de uso médio da CPU no intervalo
LIMITE_MEMORIA=85            # % da memória em uso
LIMITE_DISCO=85              # % do disco raiz
LIMITE_CRITICO=95            # acima disto o alerta sobe de Alta para Desastre
URL_SAUDE="http://127.0.0.1/health"   # passa pelo Nginx até a API e o banco
FALHAS_PARA_RECUPERAR=2      # checagens seguidas com a API fora antes de agir
REPETIR_ALERTA_MIN=10        # alerta que continua ativo é repetido a cada N minutos

# ---------- Logs ----------
DIR_LOGS="/var/log/hakari"
